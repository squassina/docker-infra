name: Validate

on:
  push:
    branches: [main, master]   # a branch padrão do repositório é a master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (yamllint, shellcheck, .env)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar linters (versões fixas)
        run: pip install --quiet -r tests/requirements-lint.txt

      - name: yamllint
        run: yamllint -s .

      - name: shellcheck
        run: shellcheck --version && shellcheck scripts/*.sh

      - name: Nenhum .env real versionado
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::Arquivo .env versionado. Remova-o do git (git rm --cached) e troque os segredos."
            exit 1
          fi

  compose:
    name: Compose config (${{ matrix.stack }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        stack: [stack-management, stack-media, stack-monitoring, stack-dns]
    steps:
      - uses: actions/checkout@v7

      - name: docker compose config + guardas de variáveis obrigatórias
        run: scripts/validate_compose.sh ${{ matrix.stack }}

  tests:
    name: Testes de convenções (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - run: pip install --quiet -r tests/requirements.txt

      - run: python -m pytest tests -v

  docs:
    name: README em sincronia com os arquivos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python scripts/sync_readme.py --check

  secrets:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read      # o gitleaks lista os commits do PR pela API
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Gratuito em repositórios pessoais; organizações precisam de GITLEAKS_LICENSE.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  ci-ok:
    name: CI ok
    if: always()
    needs: [lint, compose, tests, docs, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Todos os jobs passaram?
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::Algum job falhou"; exit 1
          fi
